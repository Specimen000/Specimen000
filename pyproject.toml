[project]
name = "the-specimen"
version = "0.0.0"
description = "Enclosure software for SPECIMEN 000."
requires-python = ">=3.10"
readme = "README.md"
license = { file = "LICENSE" }
dependencies = []

[project.optional-dependencies]
plates = ["Pillow>=10"]
dev = ["pytest>=8", "Pillow>=10"]

[project.scripts]
specimen = "specimen.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["specimen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
